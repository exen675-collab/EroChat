<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EroChat — Redesign mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
/* ───────────── Tokens ───────────── */
:root {
    color-scheme: dark;
    --bg: #0a0a0c;
    --surface: #111114;
    --surface-2: #17171b;
    --surface-3: #1f1f25;
    --line: rgba(255, 255, 255, 0.06);
    --line-strong: rgba(255, 255, 255, 0.11);
    --text: #ececf1;
    --muted: #a1a1ac;
    --faint: #6b6b76;
    --accent: #f06292;
    --accent-soft: color-mix(in oklab, var(--accent) 16%, transparent);
    --accent-text: color-mix(in oklab, var(--accent) 70%, white);
    --success: #5fd4a0;
    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 16px;
    --font-ui: 'Inter', system-ui, sans-serif;
    --font-prose: 'Newsreader', Georgia, serif;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #2c2c33 transparent; }
html, body { margin: 0; height: 100%; }
body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 var(--font-ui);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; margin: 0; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
img { display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.lucide { width: 18px; height: 18px; stroke-width: 1.75; flex-shrink: 0; }

/* ───────────── Shell ───────────── */
.app {
    height: 100dvh;
    display: grid;
    grid-template-columns: 64px 300px minmax(0, 1fr) auto;
    transition: grid-template-columns 0.3s var(--ease);
}
.app.view-library, .app.view-studio { grid-template-columns: 64px minmax(0, 1fr); }
.app.view-library .list, .app.view-library .chat, .app.view-library .panel,
.app.view-studio .list, .app.view-studio .chat, .app.view-studio .panel { display: none; }
.app:not(.view-library) .library { display: none; }
.app:not(.view-studio) .studio { display: none; }

/* Rail */
.rail {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 14px 0; border-right: 1px solid var(--line); background: var(--bg);
}
.rail__logo { width: 34px; height: 34px; border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
.rail__logo img { width: 100%; height: 100%; object-fit: cover; }
.rail button {
    width: 44px; height: 44px; border-radius: var(--r-md); display: grid; place-items: center;
    color: var(--faint); position: relative; transition: color .15s, background .15s;
}
.rail button:hover { color: var(--text); background: var(--surface-2); }
.rail button.is-active { color: var(--text); background: var(--surface-3); }
.rail button.is-active::before {
    content: ''; position: absolute; left: -10px; top: 12px; bottom: 12px; width: 3px;
    border-radius: 0 3px 3px 0; background: var(--accent);
}
.rail button[data-tip]:hover::after {
    content: attr(data-tip); position: absolute; left: 54px; white-space: nowrap;
    background: var(--surface-3); color: var(--text); font-size: 12px; font-weight: 500;
    padding: 5px 9px; border-radius: 6px; border: 1px solid var(--line-strong); z-index: 50;
}
.rail__spacer { flex: 1; }
.rail__me {
    width: 34px; height: 34px; border-radius: 50%; background: var(--surface-3);
    display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--muted);
}

/* Conversation list */
.list { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--surface); min-width: 0; }
.list__head { padding: 18px 16px 10px; display: flex; align-items: center; justify-content: space-between; }
.list__head h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.icon-btn {
    width: 34px; height: 34px; border-radius: var(--r-sm); display: grid; place-items: center;
    color: var(--muted); transition: background .15s, color .15s;
}
.icon-btn:hover { background: var(--surface-3); color: var(--text); }
.icon-btn.is-on { color: var(--accent-text); background: var(--accent-soft); }
.search {
    margin: 0 12px 8px; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 11px;
    background: var(--surface-2); border-radius: var(--r-sm); color: var(--faint);
}
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 13px; }
.search input::placeholder { color: var(--faint); }
.convos { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
.convo {
    width: 100%; display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: var(--r-md);
    text-align: left; transition: background .15s;
}
.convo:hover { background: var(--surface-2); }
.convo.is-active { background: var(--surface-3); }
.convo__body { flex: 1; min-width: 0; }
.convo__top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.convo__name { font-weight: 600; font-size: 14px; }
.convo__time { font-size: 11px; color: var(--faint); flex-shrink: 0; }
.convo__last {
    font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px;
}
.convo__unread { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex-shrink: 0; }

/* Portrait / avatar */
.pic {
    --size: 44px; width: var(--size); height: var(--size); border-radius: 50%; flex-shrink: 0;
    overflow: hidden; position: relative; background: var(--grad, var(--surface-3));
    display: grid; place-items: center; font-family: var(--font-prose); font-weight: 500;
    font-size: calc(var(--size) * 0.42); color: rgba(255,255,255,.9);
}
.pic img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; }
.pic--ring { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--c); }

/* ───────────── Chat ───────────── */
.chat { position: relative; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.chat__backdrop {
    position: absolute; inset: -40px; background-size: cover; background-position: center 20%;
    filter: blur(48px) saturate(1.2); opacity: 0.16; pointer-events: none; transition: background-image .4s;
}
.chat__backdrop::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,10,12,.5), var(--bg) 85%);
}
.chat__head {
    position: relative; z-index: 2; height: 64px; display: flex; align-items: center; gap: 12px;
    padding: 0 16px 0 20px; border-bottom: 1px solid var(--line);
    background: rgba(10,10,12,.55); backdrop-filter: blur(16px);
}
.chat__back { display: none; }
.chat__title { flex: 1; min-width: 0; }
.chat__title strong { display: block; font-size: 15px; font-weight: 600; }
.chat__title span { font-size: 12px; color: var(--faint); display: flex; gap: 6px; align-items: center; }
.model-chip {
    display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px;
    border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line);
    font-size: 12px; color: var(--muted);
}
.model-chip svg.lucide { width: 14px; height: 14px; }
.model-chip:hover { color: var(--text); border-color: var(--line-strong); }

.stream { position: relative; z-index: 1; flex: 1; overflow-y: auto; scroll-behavior: smooth; }
.stream__inner { max-width: 720px; margin: 0 auto; padding: 40px 28px 24px; }
.day { text-align: center; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 8px 0 28px; }

.msg { position: relative; margin-bottom: 28px; animation: rise .35s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.msg--ai { padding-left: 0; }
.msg__who { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.msg__who .pic { --size: 26px; }
.msg__who strong { font-size: 13px; font-weight: 600; color: var(--accent-text); }
.msg__who time { font-size: 11px; color: var(--faint); }
.prose { font-family: var(--font-prose); font-size: 18px; line-height: 1.68; color: #e7e3ea; letter-spacing: 0.003em; }
.prose p { margin: 0 0 .7em; }
.prose p:last-child { margin-bottom: 0; }
.prose em { color: var(--muted); font-style: italic; }
.prose .caret { display: inline-block; width: 2px; height: 1.05em; background: var(--accent); vertical-align: -0.15em; margin-left: 2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.scene {
    margin: 16px 0 4px; border-radius: var(--r-lg); overflow: hidden; position: relative; cursor: zoom-in;
    width: min(100%, 360px); aspect-ratio: 4 / 5; background: var(--surface-2);
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
}
.scene img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; transition: transform .6s var(--ease); }
.scene:hover img { transform: scale(1.02); }
.scene__tag {
    position: absolute; left: 12px; bottom: 12px; font-size: 11px; font-weight: 500; padding: 4px 9px;
    border-radius: 999px; background: rgba(0,0,0,.55); backdrop-filter: blur(8px); color: #ddd;
    display: inline-flex; gap: 5px; align-items: center;
}
.scene__tag svg.lucide { width: 12px; height: 12px; }

.msg--user { display: flex; flex-direction: column; align-items: flex-end; }
.bubble {
    max-width: 78%; padding: 10px 15px; border-radius: 18px 18px 6px 18px;
    background: var(--surface-3); border: 1px solid var(--line); font-size: 15px; line-height: 1.55; color: var(--text);
}
.bubble p { margin: 0; }
.bubble p + p { margin-top: .5em; }
.msg--user time { font-size: 11px; color: var(--faint); margin-top: 5px; padding-right: 4px; }

.actions {
    display: flex; gap: 2px; margin-top: 8px; opacity: 0; transform: translateY(-2px);
    transition: opacity .15s, transform .15s;
}
.msg:hover .actions, .msg:focus-within .actions, .msg.is-last .actions { opacity: 1; transform: none; }
.msg--user .actions { justify-content: flex-end; }
.actions button {
    height: 30px; min-width: 30px; padding: 0 8px; border-radius: var(--r-sm); color: var(--faint);
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500;
}
.actions button svg.lucide { width: 15px; height: 15px; }
.actions button:hover { color: var(--text); background: var(--surface-2); }
.actions .sep { width: 1px; background: var(--line-strong); margin: 7px 4px; }
.swipe { display: inline-flex; align-items: center; gap: 2px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.swipe span { min-width: 30px; text-align: center; }
.regen { color: var(--accent-text) !important; }

.typing { display: flex; gap: 10px; align-items: center; color: var(--faint); font-size: 13px; margin-bottom: 28px; }
.typing .pic { --size: 26px; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: .4; animation: dot 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 30% { opacity: 1; transform: translateY(-3px); } }

.jump {
    position: absolute; z-index: 3; left: 50%; bottom: 120px; transform: translate(-50%, 10px); opacity: 0; pointer-events: none;
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px 7px 11px; border-radius: 999px;
    background: var(--surface-3); border: 1px solid var(--line-strong); font-size: 12px; font-weight: 500;
    box-shadow: 0 8px 30px rgba(0,0,0,.4); transition: all .2s var(--ease);
}
.jump.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.jump svg.lucide { width: 15px; height: 15px; }

/* Composer */
.composer-wrap { position: relative; z-index: 2; padding: 0 28px 20px; }
.suggestions { max-width: 720px; margin: 0 auto 10px; display: flex; gap: 8px; flex-wrap: wrap; }
.suggestions button {
    padding: 7px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line);
    font-size: 13px; color: var(--muted); transition: all .15s; max-width: 100%; text-align: left;
}
.suggestions button:hover { color: var(--text); border-color: var(--accent); }
.composer {
    max-width: 720px; margin: 0 auto; display: flex; align-items: flex-end; gap: 6px; padding: 8px;
    background: rgba(23,23,27,.85); backdrop-filter: blur(20px); border: 1px solid var(--line-strong);
    border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.35); transition: border-color .2s;
}
.composer:focus-within { border-color: color-mix(in oklab, var(--accent) 45%, transparent); }
.composer textarea {
    flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: none; padding: 8px 4px;
    font-size: 15px; line-height: 1.5; max-height: 220px; min-height: 38px;
}
.composer textarea::placeholder { color: var(--faint); }
.send {
    width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0;
    background: var(--accent); color: #111; transition: transform .1s, opacity .15s, background .2s;
}
.send:disabled { opacity: .3; cursor: default; }
.send:not(:disabled):active { transform: scale(.94); }
.send.is-stop { background: var(--text); }
.plus-wrap { position: relative; }
.menu {
    position: absolute; bottom: 46px; left: 0; width: 240px; padding: 6px; border-radius: var(--r-md);
    background: var(--surface-3); border: 1px solid var(--line-strong); box-shadow: 0 16px 50px rgba(0,0,0,.5);
    display: none;
}
.menu.open { display: block; animation: rise .15s var(--ease); }
.menu button {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm);
    font-size: 13px; text-align: left;
}
.menu button:hover { background: rgba(255,255,255,.05); }
.menu button small { margin-left: auto; color: var(--faint); font-size: 11px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }
.composer-hint { max-width: 720px; margin: 7px auto 0; font-size: 11px; color: var(--faint); text-align: center; }
kbd { font: 500 10px var(--font-ui); padding: 1px 5px; border-radius: 4px; background: var(--surface-3); border: 1px solid var(--line-strong); }

/* ───────────── Character panel ───────────── */
.panel {
    width: 320px; border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto;
    transition: width .3s var(--ease), opacity .2s; position: relative;
}
.app.panel-closed .panel { width: 0; opacity: 0; border: 0; overflow: hidden; }
.panel__inner { width: 320px; }
.panel__hero { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--grad, var(--surface-3)); }
.panel__hero img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; }
.panel__hero .initial { position: absolute; inset: 0; display: grid; place-items: center; font: 500 96px var(--font-prose); color: rgba(255,255,255,.85); }
.panel__hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, var(--surface) 98%); }
.panel__name { position: absolute; z-index: 2; left: 20px; right: 20px; bottom: 14px; }
.panel__name h2 { font: 500 30px/1.1 var(--font-prose); margin: 0; letter-spacing: -0.01em; }
.panel__name p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.panel__section { padding: 16px 20px; border-top: 1px solid var(--line); }
.panel__section:first-of-type { border-top: 0; }
.panel__label {
    display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-bottom: 10px;
}
.panel__label button { font-size: 12px; letter-spacing: 0; text-transform: none; font-weight: 500; color: var(--accent-text); }
.panel__desc { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
.panel__btns { display: flex; gap: 8px; padding: 4px 20px 16px; }
.btn {
    height: 36px; padding: 0 14px; border-radius: var(--r-sm); display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 500; background: var(--surface-3); border: 1px solid var(--line); transition: all .15s;
}
.btn:hover { border-color: var(--line-strong); background: #26262d; }
.btn svg.lucide { width: 15px; height: 15px; }
.btn--grow { flex: 1; justify-content: center; }
.meter { height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; margin: 8px 0 6px; }
.meter i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .4s var(--ease); }
.meter-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.meter-row b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.stats3 div { background: var(--surface-2); border-radius: var(--r-sm); padding: 9px 10px; }
.stats3 b { display: block; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stats3 span { font-size: 11px; color: var(--faint); }
.memory { font-size: 13px; color: var(--muted); line-height: 1.55; padding: 10px 12px; background: var(--surface-2); border-radius: var(--r-sm); margin-bottom: 6px; border-left: 2px solid var(--accent); }
.scenes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.scenes div { aspect-ratio: 1; border-radius: var(--r-sm); overflow: hidden; background: var(--grad, var(--surface-2)); }
.scenes img { width: 100%; height: 100%; object-fit: cover; }

/* ───────────── Library ───────────── */
.library, .studio { overflow-y: auto; }
.page-bar {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 16px 28px;
    background: rgba(10,10,12,.8); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line);
}
.page-bar h1 { font-size: 17px; font-weight: 600; margin: 0 8px 0 0; }
.tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 10px; }
.tabs button { height: 30px; padding: 0 12px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--muted); }
.tabs button.is-active { background: var(--surface-3); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.page-bar .search { margin: 0 0 0 auto; width: 260px; }
.btn--primary { background: var(--accent); color: #111; border-color: transparent; }
.btn--primary:hover { background: var(--accent); filter: brightness(1.08); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; padding: 24px 28px 60px; }
.card {
    position: relative; aspect-ratio: 2 / 3; border-radius: var(--r-lg); overflow: hidden; text-align: left;
    background: var(--grad, var(--surface-2)); transition: transform .25s var(--ease), box-shadow .25s;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 18px 40px rgba(0,0,0,.45); }
.card img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; transition: transform .6s var(--ease); }
.card:hover img { transform: scale(1.04); }
.card .initial { position: absolute; inset: 0; display: grid; place-items: center; font: 500 72px var(--font-prose); color: rgba(255,255,255,.8); padding-bottom: 60px; }
.card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,.88)); }
.card__info { position: absolute; z-index: 2; left: 14px; right: 14px; bottom: 14px; }
.card__info h3 { font: 500 22px/1.15 var(--font-prose); margin: 0; }
.card__info p { margin: 4px 0 0; font-size: 12px; color: rgba(255,255,255,.7); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card__meta { position: absolute; z-index: 2; top: 10px; right: 10px; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 99px; background: rgba(0,0,0,.5); backdrop-filter: blur(8px); }
.card--new { display: grid; place-items: center; background: transparent; border: 1.5px dashed var(--line-strong); color: var(--muted); }
.card--new::after { display: none; }
.card--new div { text-align: center; }
.card--new svg.lucide { width: 28px; height: 28px; margin: 0 auto 8px; }

.studio__empty { display: grid; place-items: center; height: calc(100% - 70px); color: var(--faint); text-align: center; }
.studio__empty svg.lucide { width: 36px; height: 36px; margin: 0 auto 10px; }

/* Mockup banner */
.mock-note {
    position: fixed; z-index: 100; right: 14px; top: 14px; font-size: 11px; color: var(--faint);
    padding: 5px 10px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line);
}

/* ───────────── Mobile ───────────── */
.bottom-nav { display: none; }
@media (max-width: 1180px) {
    .app { grid-template-columns: 64px 280px minmax(0, 1fr) 0; }
    .panel { position: fixed; right: 0; top: 0; bottom: 0; z-index: 30; box-shadow: -20px 0 60px rgba(0,0,0,.5); }
}
@media (max-width: 820px) {
    .mock-note { display: none; }
    .app, .app.view-library, .app.view-studio { grid-template-columns: 1fr; padding-bottom: 64px; }
    .rail { display: none; }
    .bottom-nav {
        display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; z-index: 40; left: 0; right: 0; bottom: 0;
        height: calc(64px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
        background: rgba(10,10,12,.92); backdrop-filter: blur(18px); border-top: 1px solid var(--line);
    }
    .bottom-nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: var(--faint); }
    .bottom-nav button.is-active { color: var(--text); }
    .bottom-nav button.is-active svg.lucide { color: var(--accent); }
    .list { border: 0; }
    .chat { display: none; position: fixed; inset: 0; z-index: 45; background: var(--bg); }
    .app.chat-open .chat { display: flex; }
    .chat__back { display: grid; }
    .stream__inner { padding: 24px 18px 16px; }
    .prose { font-size: 17px; }
    .composer-wrap { padding: 0 12px calc(12px + env(safe-area-inset-bottom)); }
    .composer-hint { display: none; }
    .jump { bottom: 96px; }
    .app.panel-closed .panel { width: 0; }
    .panel { width: 100%; z-index: 60; }
    .panel__inner { width: 100%; }
    .panel__close-m { display: grid !important; }
    .page-bar { flex-wrap: wrap; padding: 14px 16px; }
    .page-bar .search { width: 100%; order: 5; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 16px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="app" id="app">
    <!-- Rail -->
    <nav class="rail" aria-label="Main">
        <div class="rail__logo"><img src="../public/favicon.png" alt="EroChat" /></div>
        <button data-view="chats" data-tip="Chats" class="is-active"><i data-lucide="messages-square"></i></button>
        <button data-view="library" data-tip="Library"><i data-lucide="library-big"></i></button>
        <button data-view="studio" data-tip="Studio"><i data-lucide="sparkles"></i></button>
        <div class="rail__spacer"></div>
        <button data-tip="Settings"><i data-lucide="settings-2"></i></button>
        <div class="rail__me" title="@adam">A</div>
    </nav>

    <!-- Conversation list -->
    <section class="list">
        <div class="list__head">
            <h1>Chats</h1>
            <button class="icon-btn" title="New chat"><i data-lucide="square-pen"></i></button>
        </div>
        <label class="search"><i data-lucide="search"></i><input placeholder="Search chats" id="convoSearch" /></label>
        <div class="convos" id="convos"></div>
    </section>

    <!-- Chat -->
    <section class="chat">
        <div class="chat__backdrop" id="backdrop"></div>
        <header class="chat__head">
            <button class="icon-btn chat__back" id="back" aria-label="Back"><i data-lucide="chevron-left"></i></button>
            <div class="pic" id="headPic" style="--size:36px"></div>
            <div class="chat__title">
                <strong id="headName"></strong>
                <span id="headSub"></span>
            </div>
            <button class="model-chip" title="Switch model"><i data-lucide="cpu"></i><span>claude-sonnet-5</span><i data-lucide="chevron-down"></i></button>
            <button class="icon-btn" title="Search in chat"><i data-lucide="search"></i></button>
            <button class="icon-btn is-on" id="panelToggle" title="Character panel"><i data-lucide="panel-right"></i></button>
        </header>
        <div class="stream" id="stream"><div class="stream__inner" id="streamInner"></div></div>
        <button class="jump" id="jump"><i data-lucide="arrow-down"></i> New messages</button>
        <div class="composer-wrap">
            <div class="suggestions" id="suggestions"></div>
            <div class="composer">
                <div class="plus-wrap">
                    <button class="icon-btn" id="plus" title="Tools" style="height:38px;width:38px"><i data-lucide="plus"></i></button>
                    <div class="menu" id="menu">
                        <button data-act="suggest"><i data-lucide="lightbulb"></i> Suggest replies <small>⌘J</small></button>
                        <button data-act="upgrade"><i data-lucide="wand-sparkles"></i> Upgrade my draft</button>
                        <button><i data-lucide="image"></i> Generate scene image</button>
                        <hr />
                        <button><i data-lucide="brain"></i> Compress memory</button>
                        <button><i data-lucide="code-xml"></i> Preview request</button>
                    </div>
                </div>
                <textarea id="input" rows="1" placeholder="Message…"></textarea>
                <button class="send" id="send" disabled aria-label="Send"><i data-lucide="arrow-up"></i></button>
            </div>
            <div class="composer-hint"><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> new line · wrap text in *asterisks* for narration</div>
        </div>
    </section>

    <!-- Character panel -->
    <aside class="panel" id="panel"><div class="panel__inner" id="panelInner"></div></aside>

    <!-- Library -->
    <section class="library">
        <div class="page-bar">
            <h1>Library</h1>
            <div class="tabs"><button class="is-active">Mine</button><button>Community</button></div>
            <label class="search"><i data-lucide="search"></i><input placeholder="Search characters" /></label>
            <button class="btn"><i data-lucide="upload"></i> Import</button>
            <button class="btn btn--primary"><i data-lucide="plus"></i> New</button>
        </div>
        <div class="grid" id="libGrid"></div>
    </section>

    <!-- Studio -->
    <section class="studio">
        <div class="page-bar"><h1>Studio</h1><div class="tabs"><button class="is-active">Create</button><button>Gallery</button></div></div>
        <div class="studio__empty"><div><i data-lucide="sparkles"></i>Studio isn't in this mockup.<br />It would merge Create + Gallery: prompt on top, results grid below.</div></div>
    </section>

    <nav class="bottom-nav" aria-label="Mobile">
        <button data-view="chats" class="is-active"><i data-lucide="messages-square"></i>Chats</button>
        <button data-view="library"><i data-lucide="library-big"></i>Library</button>
        <button data-view="studio"><i data-lucide="sparkles"></i>Studio</button>
        <button><i data-lucide="circle-user-round"></i>You</button>
    </nav>
</div>

<script>
const IMG = '../public/anime_login.png';
const characters = [
    {
        id: 'aiko', name: 'Aiko', tagline: 'Bedroom producer · stubborn about bridges',
        accent: '#f06292', img: IMG, time: 'now', unread: false,
        desc: 'A 22-year-old music producer who lives in her headphones. Warm, teasing, and brutally honest about sound — less so about her own feelings.',
        memories: ['You met at a campus open-mic. She was running the sound desk and you fixed a broken cable.', 'She has a demo due to a small label on Friday.'],
        context: [24, 40], archived: 12,
        messages: [
            { role: 'ai', t: '21:02', text: '*The music cuts out the moment you step into the studio. Aiko spins around on her chair, one headphone still pressed to her ear.*\n"You\'re late. I\'ve been looping the same eight bars for an hour waiting for a second opinion."' },
            { role: 'user', t: '21:03', text: 'Sorry, the train was packed. Play it for me?' },
            { role: 'ai', t: '21:03', scene: true, text: '*She grins and slides the headphones off, holding them out to you across the cluttered desk.*\n"Okay, but you have to be honest. Brutally honest." *She taps the spacebar. A soft synth line fills the room, warm and a little melancholy.* "The bridge is where it falls apart. I can feel it, I just can\'t fix it."' },
            { role: 'user', t: '21:05', text: "The melody's great. Maybe the bridge needs to breathe — drop the drums for four bars?" },
            {
                role: 'ai', t: '21:05', variant: 1, variants: [
                    '*Aiko stares at you for a long second, then at the screen, then back at you.*\n"...Drop the drums." *She mutes the track, scrubs back, and hits play. The synth hangs in the empty space, suddenly enormous.* "Oh. Oh, that\'s annoying. That\'s really annoying, because you\'re right."',
                    '*She narrows her eyes, fingers already hovering over the mixer.* "Four bars of nothing? That\'s either genius or a disaster." *A beat.* "Fine. But if it\'s a disaster, you\'re buying dinner."',
                    '*Aiko leans back until the chair creaks, arms crossed.* "I tried that at two in the morning and hated it." *She pauses.* "...But I was also eating cereal out of a mug, so maybe my judgment was compromised. Play it again."'
                ]
            }
        ]
    },
    {
        id: 'kai', name: 'Kai', tagline: 'Lighthouse keeper on a forgotten coast', accent: '#4fd1c5',
        grad: 'linear-gradient(145deg,#0f766e,#134e4a 55%,#0b1f1e)', time: '2h', unread: true,
        desc: 'Quiet, observant, and fond of storms. Keeps a logbook of every ship that passes — and of every visitor.',
        memories: ['You washed ashore after the ferry capsized.'], context: [8, 40], archived: 0,
        messages: [
            { role: 'ai', t: '18:40', text: '*The lamp turns overhead, sweeping the rain-dark sea.* "You\'re awake. Good. The kettle\'s on — you\'ll want something warm before you tell me how you ended up on my rocks."' }
        ]
    },
    {
        id: 'mira', name: 'Mira', tagline: 'Rogue cartographer, allergic to rules', accent: '#f6ad55',
        grad: 'linear-gradient(145deg,#b45309,#78350f 55%,#1c1206)', time: 'Yesterday', unread: false,
        desc: 'Maps places that officially don\'t exist. Talks fast, lies faster, always pays her debts.',
        memories: [], context: [30, 40], archived: 40,
        messages: [
            { role: 'user', t: 'Yesterday', text: 'So where does this map actually lead?' },
            { role: 'ai', t: 'Yesterday', text: '*Mira folds the map in half before you can get a better look.* "Somewhere worth the trouble. That\'s all you get until we\'re past the border."' }
        ]
    },
    {
        id: 'vesper', name: 'Vesper', tagline: 'Night-shift librarian at the Archive', accent: '#7f9cf5',
        grad: 'linear-gradient(145deg,#3730a3,#1e1b4b 60%,#0b0a1a)', time: 'Mon', unread: false,
        desc: 'Speaks softly, remembers everything, and has opinions about your late returns.',
        memories: [], context: [4, 40], archived: 0,
        messages: [{ role: 'ai', t: 'Mon', text: '"The archive closes at dawn. Until then, ask me anything — just keep your voice down."' }]
    },
    {
        id: 'rowan', name: 'Rowan', tagline: 'Retired duelist running a tea shop', accent: '#68d391',
        grad: 'linear-gradient(145deg,#276749,#1c4532 55%,#0a1a12)', time: 'Sep 12', unread: false,
        desc: 'Swapped the blade for a teapot. The blade has not forgotten.',
        memories: [], context: [2, 40], archived: 0,
        messages: [{ role: 'ai', t: 'Sep 12', text: '*A cup is set before you before you\'ve even sat down.* "Oolong. You look like an oolong person."' }]
    }
];
const suggestionsFor = {
    aiko: ['"Told you. Now record it before you change your mind."', '*Lean over her shoulder and point at the waveform.* "What if the vocals come back here?"', '"Dinner\'s on me either way. You earned it."']
};
const replyFor = '*Aiko is already dragging clips around, humming under her breath.* "Okay, okay — if the vocals come back on the fourth bar instead of the first, it lands like a punch." *She glances up at you, eyes bright.* "Stay. I need you here for the next hour, at least."';

let current = characters[0];
let streaming = null;
const $ = (id) => document.getElementById(id);
const app = $('app');

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const prose = (text) => text.split('\n').map((line) =>
    '<p>' + line.split(/(\*[^*]+\*)/g).map((seg) =>
        seg.startsWith('*') && seg.endsWith('*') && seg.length > 2 ? `<em>${esc(seg.slice(1, -1))}</em>` : esc(seg)
    ).join('') + '</p>').join('');
const pic = (c, size = 44, extra = '') =>
    `<div class="pic ${extra}" style="--size:${size}px;--grad:${c.grad || 'none'};--c:${c.accent}">${c.img ? `<img src="${c.img}" alt="">` : c.name[0]}</div>`;
const icons = () => window.lucide && lucide.createIcons();
const lastText = (c) => { const m = c.messages.at(-1); const t = m.variants ? m.variants[m.variant] : m.text; return (m.role === 'user' ? 'You: ' : '') + t.replace(/\*/g, '').replace(/\n/g, ' '); };

function renderConvos(filter = '') {
    $('convos').innerHTML = characters
        .filter((c) => c.name.toLowerCase().includes(filter.toLowerCase()))
        .map((c) => `
        <button class="convo ${c === current ? 'is-active' : ''}" data-id="${c.id}" style="--c:${c.accent}">
            ${pic(c, 46)}
            <div class="convo__body">
                <div class="convo__top"><span class="convo__name">${c.name}</span><span class="convo__time">${c.time}</span></div>
                <div class="convo__last">${esc(lastText(c))}</div>
            </div>
            ${c.unread ? '<span class="convo__unread"></span>' : ''}
        </button>`).join('');
    $('convos').querySelectorAll('.convo').forEach((b) => b.onclick = () => select(b.dataset.id));
}

function renderMessages() {
    const c = current;
    const lastAi = c.messages.map((m) => m.role).lastIndexOf('ai');
    let html = '<div class="day">Today</div>';
    c.messages.forEach((m, i) => {
        if (m.role === 'user') {
            html += `<div class="msg msg--user"><div class="bubble">${prose(m.text)}</div><time>${m.t}</time>
                <div class="actions"><button title="Edit"><i data-lucide="pencil"></i></button><button title="Copy"><i data-lucide="copy"></i></button><button title="Delete"><i data-lucide="trash-2"></i></button></div></div>`;
            return;
        }
        const isLast = i === lastAi && !streaming;
        const text = m.variants ? m.variants[m.variant] : m.text;
        html += `<div class="msg msg--ai ${isLast ? 'is-last' : ''}">
            <div class="msg__who">${pic(c, 26)}<strong>${c.name}</strong><time>${m.t}</time></div>
            <div class="prose">${prose(text)}${m.streaming ? '<span class="caret"></span>' : ''}</div>
            ${m.scene ? `<div class="scene"><img src="${IMG}" alt="Scene"><span class="scene__tag"><i data-lucide="image"></i> Scene · 1024×640</span></div>` : ''}
            ${m.streaming ? '' : `<div class="actions">
                ${isLast && m.variants ? `<span class="swipe"><button data-swipe="-1" title="Previous"><i data-lucide="chevron-left"></i></button><span>${m.variant + 1} / ${m.variants.length}</span><button data-swipe="1" title="Next"><i data-lucide="chevron-right"></i></button></span><span class="sep"></span>` : ''}
                ${isLast ? '<button class="regen" data-regen><i data-lucide="refresh-cw"></i> Regenerate</button>' : ''}
                <button title="Read aloud"><i data-lucide="volume-2"></i></button>
                <button title="Copy"><i data-lucide="copy"></i></button>
                <button title="Edit"><i data-lucide="pencil"></i></button>
                <button title="Scene image"><i data-lucide="image-plus"></i></button>
                <button title="Branch from here"><i data-lucide="git-branch"></i></button>
                <button title="Delete"><i data-lucide="trash-2"></i></button>
            </div>`}
        </div>`;
    });
    if (streaming && !streaming.text) {
        html += `<div class="typing">${pic(c, 26)}<span class="dots"><i></i><i></i><i></i></span>${c.name} is writing…</div>`;
    }
    $('streamInner').innerHTML = html;
    $('streamInner').querySelectorAll('[data-swipe]').forEach((b) => b.onclick = () => {
        const m = c.messages[lastAi];
        m.variant = (m.variant + Number(b.dataset.swipe) + m.variants.length) % m.variants.length;
        renderMessages(); renderConvos();
    });
    const regen = $('streamInner').querySelector('[data-regen]');
    if (regen) regen.onclick = () => {
        const m = c.messages[lastAi];
        if (m.variants) { m.variant = (m.variant + 1) % m.variants.length; renderMessages(); }
    };
    icons();
}

function renderPanel() {
    const c = current;
    const pct = Math.round((c.context[0] / c.context[1]) * 100);
    $('panelInner').innerHTML = `
        <div class="panel__hero" style="--grad:${c.grad || 'none'}">
            ${c.img ? `<img src="${c.img}" alt="">` : `<div class="initial">${c.name[0]}</div>`}
            <button class="icon-btn panel__close-m" id="panelClose" style="display:none;position:absolute;top:12px;right:12px;z-index:3;background:rgba(0,0,0,.5)"><i data-lucide="x"></i></button>
            <div class="panel__name"><h2>${c.name}</h2><p>${c.tagline}</p></div>
        </div>
        <div class="panel__btns">
            <button class="btn btn--grow"><i data-lucide="pencil"></i> Edit</button>
            <button class="btn btn--grow"><i data-lucide="share-2"></i> Publish</button>
            <button class="btn" title="More"><i data-lucide="ellipsis"></i></button>
        </div>
        <div class="panel__section"><div class="panel__label">About</div><p class="panel__desc">${c.desc}</p></div>
        <div class="panel__section">
            <div class="panel__label">Context <button>Adjust</button></div>
            <div class="meter"><i style="width:${pct}%"></i></div>
            <div class="meter-row"><span>Active messages</span><b>${c.context[0]} / ${c.context[1]}</b></div>
            <div class="stats3">
                <div><b>${c.messages.length + c.archived}</b><span>messages</span></div>
                <div><b>${c.archived}</b><span>archived</span></div>
                <div><b>${c.memories.length}</b><span>memories</span></div>
            </div>
        </div>
        <div class="panel__section">
            <div class="panel__label">Memory <button>Compress</button></div>
            ${c.memories.length ? c.memories.map((m) => `<div class="memory">${m}</div>`).join('') : '<p class="panel__desc">No memories yet. They appear once older messages are compressed.</p>'}
        </div>
        <div class="panel__section">
            <div class="panel__label">Scenes <button>View all</button></div>
            <div class="scenes">${c.img ? [1, 2, 3].map((n) => `<div><img src="${IMG}" style="object-position:50% ${n * 22}%" alt=""></div>`).join('') : [1, 2, 3].map(() => `<div style="--grad:${c.grad};opacity:.6"></div>`).join('')}</div>
        </div>`;
    const close = $('panelClose');
    if (close) close.onclick = () => togglePanel(false);
    icons();
}

function renderHeader() {
    const c = current;
    document.documentElement.style.setProperty('--accent', c.accent);
    $('headPic').outerHTML = `<div class="pic" id="headPic" style="--size:36px;--grad:${c.grad || 'none'}">${c.img ? `<img src="${c.img}" alt="">` : c.name[0]}</div>`;
    $('headName').textContent = c.name;
    $('headSub').innerHTML = `<i data-lucide="brain" style="width:12px;height:12px"></i> ${c.context[0]}/${c.context[1]} in context · ${c.memories.length} memories`;
    $('backdrop').style.backgroundImage = c.img ? `url(${c.img})` : c.grad;
    $('input').placeholder = `Message ${c.name}…`;
    renderSuggestions([]);
}

function renderLibrary() {
    $('libGrid').innerHTML = characters.map((c) => `
        <button class="card" data-id="${c.id}" style="--grad:${c.grad || 'none'}">
            ${c.img ? `<img src="${c.img}" alt="">` : `<div class="initial">${c.name[0]}</div>`}
            <span class="card__meta">${c.messages.length + c.archived} msgs</span>
            <div class="card__info"><h3>${c.name}</h3><p>${c.tagline}</p></div>
        </button>`).join('') + `<button class="card card--new"><div><i data-lucide="plus"></i>New character</div></button>`;
    $('libGrid').querySelectorAll('.card[data-id]').forEach((b) => b.onclick = () => { select(b.dataset.id); setView('chats'); });
    icons();
}

function renderSuggestions(list) {
    $('suggestions').innerHTML = list.map((s) => `<button>${esc(s)}</button>`).join('');
    $('suggestions').querySelectorAll('button').forEach((b) => b.onclick = () => { $('input').value = b.textContent; autoGrow(); renderSuggestions([]); $('input').focus(); });
}

function select(id) {
    if (streaming) stop();
    current = characters.find((c) => c.id === id);
    current.unread = false;
    renderHeader(); renderConvos($('convoSearch').value); renderMessages(); renderPanel();
    app.classList.add('chat-open');
    requestAnimationFrame(() => { $('stream').style.scrollBehavior = 'auto'; $('stream').scrollTop = 1e9; $('stream').style.scrollBehavior = ''; });
}

function setView(view) {
    app.classList.remove('view-library', 'view-studio');
    if (view !== 'chats') app.classList.add('view-' + view);
    document.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('is-active', b.dataset.view === view));
    if (view === 'library') renderLibrary();
}

function togglePanel(force) {
    const open = force ?? app.classList.contains('panel-closed');
    app.classList.toggle('panel-closed', !open);
    $('panelToggle').classList.toggle('is-on', open);
}

/* Smart autoscroll */
const nearBottom = () => { const s = $('stream'); return s.scrollHeight - s.scrollTop - s.clientHeight < 120; };
function follow(wasNear) { if (wasNear) $('stream').scrollTop = 1e9; else $('jump').classList.add('show'); }
$('stream').addEventListener('scroll', () => { if (nearBottom()) $('jump').classList.remove('show'); });
$('jump').onclick = () => { $('stream').scrollTop = 1e9; };

/* Composer */
function autoGrow() {
    const t = $('input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 220) + 'px';
    if (!streaming) $('send').disabled = !t.value.trim();
}
$('input').addEventListener('input', autoGrow);
$('input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!streaming) send(); } });
$('send').onclick = () => (streaming ? stop() : send());

function setSendMode(stopMode) {
    const b = $('send');
    b.classList.toggle('is-stop', stopMode);
    b.disabled = stopMode ? false : !$('input').value.trim();
    b.innerHTML = `<i data-lucide="${stopMode ? 'square' : 'arrow-up'}"></i>`;
    b.setAttribute('aria-label', stopMode ? 'Stop' : 'Send');
    icons();
}

function send() {
    const text = $('input').value.trim(); if (!text) return;
    const c = current;
    c.messages.forEach((m) => { if (m.variants) { m.text = m.variants[m.variant]; delete m.variants; } });
    c.messages.push({ role: 'user', t: 'now', text });
    c.time = 'now';
    $('input').value = ''; autoGrow(); renderSuggestions([]);
    streaming = { text: '' };
    setSendMode(true);
    renderMessages(); renderConvos(); $('stream').scrollTop = 1e9;
    const full = c.id === 'aiko' ? replyFor : `*${c.name} considers that for a moment.* "Tell me more — I'm listening."`;
    const msg = { role: 'ai', t: 'now', text: '', streaming: true };
    streaming.timer = setTimeout(() => {
        c.messages.push(msg);
        let i = 0;
        streaming.interval = setInterval(() => {
            const near = nearBottom();
            i += 2; msg.text = full.slice(0, i); streaming.text = msg.text;
            renderMessages(); follow(near);
            if (i >= full.length) stop();
        }, 22);
    }, 900);
    streaming.msg = msg;
}
function stop() {
    if (!streaming) return;
    clearTimeout(streaming.timer); clearInterval(streaming.interval);
    if (streaming.msg) streaming.msg.streaming = false;
    streaming = null; setSendMode(false); renderMessages(); renderConvos(); renderPanel();
}

/* Tools menu */
$('plus').onclick = (e) => { e.stopPropagation(); $('menu').classList.toggle('open'); };
document.addEventListener('click', () => $('menu').classList.remove('open'));
$('menu').querySelector('[data-act="suggest"]').onclick = () => renderSuggestions(suggestionsFor[current.id] || ['"Go on."', '*Nod slowly.*', '"What happened next?"']);
document.addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key === 'j') { e.preventDefault(); $('menu').querySelector('[data-act="suggest"]').click(); } });

/* Nav */
document.querySelectorAll('[data-view]').forEach((b) => b.onclick = () => setView(b.dataset.view));
$('panelToggle').onclick = () => togglePanel();
$('back').onclick = () => app.classList.remove('chat-open');
$('convoSearch').oninput = (e) => renderConvos(e.target.value);
if (innerWidth <= 1180) app.classList.add('panel-closed'), $('panelToggle').classList.remove('is-on');

renderHeader(); renderConvos(); renderMessages(); renderPanel(); icons();
const toBottom = () => { $('stream').style.scrollBehavior = 'auto'; $('stream').scrollTop = 1e9; $('stream').style.scrollBehavior = ''; };
toBottom(); addEventListener('load', toBottom); document.fonts?.ready.then(toBottom);
/* Demo hashes: #library, #studio, #chat (mobile open chat), #panel (mobile panel), #suggest, #streaming */
const h = location.hash.slice(1);
if (h === 'library' || h === 'studio') setView(h);
if (h === 'chat' || h === 'panel') app.classList.add('chat-open');
if (h === 'panel') togglePanel(true);
if (h === 'suggest') $('menu').querySelector('[data-act="suggest"]').click();
if (h === 'streaming') { $('input').value = 'Play it again, from the top.'; send(); }
</script>
</body>
</html>
