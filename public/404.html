<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex" />
        <title>Page not found · EroChat</title>
        <style>
            * {
                box-sizing: border-box;
            }

            html,
            body {
                min-height: 100%;
                margin: 0;
            }

            body {
                display: grid;
                place-items: center;
                overflow: hidden;
                background: #171717;
            }

            a {
                display: block;
                width: 100vw;
                height: 100vh;
            }

            img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
            }
        </style>
    </head>
    <body>
        <a href="/" aria-label="Return to EroChat">
            <img src="/404-error.png" alt="Page not found. Return to EroChat." />
        </a>
    </body>
</html>
